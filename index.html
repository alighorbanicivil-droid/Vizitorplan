<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>راهنمای بازدیدکنندگان — نقشه‌ی محور</title>
<style>
  :root { --ink:#0b2a40; --mut:#5a6875; --line:#dfe6ec; --acc:#c9962b; --me:#1e88e5; --bg:#f4f7fa; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, Tahoma, sans-serif; background:var(--bg); color:var(--ink); -webkit-text-size-adjust:100%; }
  header { background:linear-gradient(135deg,#0b2a40,#2d6e8f); color:#fff; padding:16px; }
  header h1 { margin:0; font-size:18px; }
  header p { margin:4px 0 0; font-size:13px; color:#dbe9f2; }
  main { padding:12px 16px 24px; max-width:720px; margin:0 auto; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:12px; }
  .status { font-size:15px; font-weight:700; }
  .sub { font-size:13px; color:var(--mut); margin-top:4px; line-height:1.7; }
  .big { font-size:22px; font-weight:800; color:var(--ink); margin-top:6px; }
  button { width:100%; font:inherit; font-size:16px; font-weight:700; padding:14px; border:0; border-radius:10px; background:var(--ink); color:#fff; cursor:pointer; }
  button[disabled] { opacity:.5; }
  .plan { width:100%; height:auto; display:block; background:#fff; border:1px solid var(--line); border-radius:12px; }
  .legend { font-size:12px; color:var(--mut); margin-top:6px; line-height:2; }
  .legend span { margin-left:10px; white-space:nowrap; }
  .legend i { display:inline-block; width:14px; height:4px; border-radius:2px; vertical-align:middle; margin-left:4px; }
  .warn { color:#b26a00; }
  .ok { color:#2e7d32; }
  .bad { color:#c62828; }
</style>
</head>
<body>
<header>
  <h1>راهنمای بازدیدکنندگان</h1>
  <p id="pname"></p>
</header>
<main>
  <div class="card">
    <div class="status" id="st">برای دیدن موقعیت خودتان، GPS گوشی را روشن کنید و دکمه را بزنید.</div>
    <div class="sub" id="det"></div>
    <div class="big" id="km" style="display:none"></div>
  </div>

  <button id="go">فعال‌سازی موقعیت (GPS)</button>

  <div class="card" style="margin-top:12px;padding:8px">
    <svg id="plan" class="plan" viewBox="0 0 720 460" role="img" aria-label="نقشه‌ی محور خیابان‌ها"></svg>
    <div class="legend" id="legend"></div>
  </div>

  <div class="card">
    <div class="sub">موقعیت شما فقط داخل همین گوشی محاسبه می‌شود و به هیچ سرور یا شخص دیگری فرستاده نمی‌شود.</div>
  </div>
</main>

<script>
(function () {
  'use strict';
  var D = JSON.parse(document.getElementById('plan-data').textContent);
  var TOL_MIN = 15;            // حداقل فاصله‌ی مجاز از محور (متر)
  var W = 720, H = 460, PAD = 26;
  var COLORS = ['#1565c0','#2e7d32','#6a1b9a','#00838f','#ef6c00','#c62828','#4e342e','#37474f','#ad1457','#558b2f','#283593','#00695c','#9e9d24','#5d4037'];
  document.getElementById('pname').textContent = D.project || '';

  // ---- UTM (WGS84) از مختصات GPS ----
  function latLonToUtm(lat, lon, zone, south) {
    var a = 6378137, f = 1 / 298.257223563, k0 = 0.9996, e2 = f * (2 - f), ep2 = e2 / (1 - e2);
    var lon0 = ((zone - 1) * 6 - 180 + 3) * Math.PI / 180;
    var phi = lat * Math.PI / 180, lam = lon * Math.PI / 180;
    var N = a / Math.sqrt(1 - e2 * Math.pow(Math.sin(phi), 2));
    var T = Math.pow(Math.tan(phi), 2), C = ep2 * Math.pow(Math.cos(phi), 2), A = (lam - lon0) * Math.cos(phi);
    var M = a * ((1 - e2 / 4 - 3 * e2 * e2 / 64 - 5 * Math.pow(e2, 3) / 256) * phi
      - (3 * e2 / 8 + 3 * e2 * e2 / 32 + 45 * Math.pow(e2, 3) / 1024) * Math.sin(2 * phi)
      + (15 * e2 * e2 / 256 + 45 * Math.pow(e2, 3) / 1024) * Math.sin(4 * phi)
      - (35 * Math.pow(e2, 3) / 3072) * Math.sin(6 * phi));
    var x = k0 * N * (A + (1 - T + C) * Math.pow(A, 3) / 6 + (5 - 18 * T + T * T + 72 * C - 58 * ep2) * Math.pow(A, 5) / 120) + 500000;
    var y = k0 * (M + N * Math.tan(phi) * (A * A / 2 + (5 - T + 9 * C + 4 * C * C) * Math.pow(A, 4) / 24 + (61 - 58 * T + T * T + 600 * C - 330 * ep2) * Math.pow(A, 6) / 720));
    if (south) y += 10000000;
    return { x: x, y: y };
  }

  // ---- جانمایی کل پروژه ----
  var X0 = Infinity, X1 = -Infinity, Y0 = Infinity, Y1 = -Infinity;
  D.streets.forEach(function (s) { s.pts.forEach(function (q) { X0 = Math.min(X0, q[1]); X1 = Math.max(X1, q[1]); Y0 = Math.min(Y0, q[2]); Y1 = Math.max(Y1, q[2]); }); });
  var dx = Math.max(X1 - X0, 1), dy = Math.max(Y1 - Y0, 1);
  var K = Math.min((W - 2 * PAD) / dx, (H - 2 * PAD) / dy);
  var OX = (W - dx * K) / 2, OY = (H - dy * K) / 2;
  function P(x, y) { return [OX + (x - X0) * K, H - (OY + (y - Y0) * K)]; }
  function ns(tag, attrs, parent) { var e = document.createElementNS('http://www.w3.org/2000/svg', tag); for (var k in attrs) e.setAttribute(k, attrs[k]); (parent || svg).appendChild(e); return e; }
  var svg = document.getElementById('plan');
  var legend = document.getElementById('legend');
  var meDot = null, meRing = null;

  D.streets.forEach(function (s, i) {
    var c = COLORS[i % COLORS.length];
    var d = s.pts.map(function (q, j) { var v = P(q[1], q[2]); return (j ? 'L' : 'M') + v[0].toFixed(1) + ' ' + v[1].toFixed(1); }).join('');
    ns('path', { d: d, fill: 'none', stroke: c, 'stroke-width': 3, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' });
    var mid = s.pts[Math.floor(s.pts.length / 2)], mv = P(mid[1], mid[2]);
    var t = ns('text', { x: mv[0].toFixed(1), y: (mv[1] - 7).toFixed(1), 'font-size': 11, 'font-weight': 700, 'text-anchor': 'middle', fill: c, stroke: '#fff', 'stroke-width': 3, 'paint-order': 'stroke' });
    t.textContent = s.name;
    legend.appendChild(document.createTextNode(' '));
    var lg = document.createElement('span'); lg.innerHTML = '<i style="background:' + c + '"></i>' + s.name.replace(/[<&]/g, '') + '  ';
    legend.appendChild(lg);
  });
  meRing = ns('circle', { r: 0, fill: 'rgba(30,136,229,.15)', stroke: '#1e88e5', 'stroke-width': 1, display: 'none' });
  meDot = ns('circle', { r: 6, fill: '#1e88e5', stroke: '#fff', 'stroke-width': 2, display: 'none' });

  // ---- تشخیص خیابان و کیلومتراژ ----
  function station(m) { var k = Math.floor(m / 1000), r = (m - k * 1000).toFixed(3); return k + '+' + ('00' + r.split('.')[0]).slice(-3) + '.' + r.split('.')[1]; }
  function locate(x, y) {
    var best = null;
    D.streets.forEach(function (s) {
      for (var j = 0; j < s.pts.length - 1; j++) {
        var a = s.pts[j], b = s.pts[j + 1];
        var vx = b[1] - a[1], vy = b[2] - a[2], L2 = vx * vx + vy * vy;
        var t = L2 > 0 ? ((x - a[1]) * vx + (y - a[2]) * vy) / L2 : 0;
        t = Math.max(0, Math.min(1, t));

  }

  var st = document.getElementById('st'), det = document.getElementById('det'), km = document.getElementById('km'), btn = document.getElementById('go');
  function show(p) {
    var u = latLonToUtm(p.coords.latitude, p.coords.longitude, D.utm.zone, D.utm.south);
    var v = P(u.x, u.y);
    meDot.setAttribute('cx', v[0].toFixed(1)); meDot.setAttribute('cy', v[1].toFixed(1)); meDot.setAttribute('display', 'inline');
    var acc = Math.max(0, p.coords.accuracy || 0);
    meRing.setAttribute('cx', v[0].toFixed(1)); meRing.setAttribute('cy', v[1].toFixed(1));
    meRing.setAttribute('r', Math.min(80, acc * K).toFixed(1)); meRing.setAttribute('display', 'inline');
    var loc = locate(u.x, u.y);
    var accTxt = 'دقت GPS حدود ' + Math.round(acc) + ' متر';
    if (!loc) { st.className = 'status warn'; st.textContent = 'موقعیت مشخص نشد.'; det.textContent = accTxt; km.style.display = 'none'; return; }
    var tol = Math.max(TOL_MIN, acc);
    if (loc.dist <= tol) {
      st.className = 'status ok'; st.textContent = 'شما در خیابان «' + loc.street + '» هستید';
      km.style.display = 'block'; km.innerHTML = 'کیلومتراژ تقریبی: <bdi dir="ltr">' + station(loc.station) + '</bdi>';
      det.textContent = 'فاصله از محور: ' + Math.round(loc.dist) + ' متر — ' + accTxt;
    } else {
      st.className = 'status warn'; st.textContent = 'خارج از محور خیابان‌ها';
      km.style.display = 'none';
      det.textContent = 'نزدیک‌ترین خیابان: «' + loc.street + '» با فاصله‌ی ' + Math.round(loc.dist) + ' متر — ' + accTxt;
    }
  }
  function fail(e) {
    st.className = 'status bad';
    st.textContent = e && e.code === 1 ? 'اجازه‌ی دسترسی به موقعیت داده نشد.' : 'GPS در دسترس نیست. کمی بیرون از ساختمان امتحان کنید.';
    det.textContent = '';
  }
  btn.addEventListener('click', function () {
    if (!navigator.geolocation) { fail({ code: 2 }); return; }
    if (location.protocol !== 'https:' && location.hostname !== 'localhost') { st.className = 'status bad'; st.textContent = 'برای GPS این صفحه باید با HTTPS باز شود.'; return; }
    btn.disabled = true; btn.textContent = 'در حال یافتن موقعیت…';
    navigator.geolocation.watchPosition(function (p) { btn.textContent = 'موقعیت لحظه‌ای فعال است'; show(p); }, function (e) { btn.disabled = false; btn.textContent = 'تلاش دوباره'; fail(e); }, { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 });
  });
})();
</script>
</body>
</html>
